name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  security:
    name: Security & SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Security Audit
        run: |
          cargo install cargo-audit cargo-deny || true
          cargo audit
          cargo deny check
      - name: SAST (Geiger)
        run: cargo install cargo-geiger || true && cargo geiger --forbid-unsafe

  lint:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
      - name: Check Formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy -- -D warnings
      - name: Check Docs
        run: cargo doc --no-deps

  frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install
      - name: Lint & Type-check
        run: |
          pnpm lint
          pnpm type-check
      - name: Build Frontend
        run: pnpm build

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint, security]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Install Nextest
        run: cargo install cargo-nextest || true
      - name: Run Tests
        run: cargo nextest run --verbose

  build:
    name: Release Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Release
        run: cargo build --release
      - name: Binary Size
        if: runner.os == 'Linux'
        run: ls -lh target/release/anydesk-pivot-detector
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ runner.os }}
          path: |
            target/release/anydesk-pivot-detector
            target/release/anydesk-pivot-detector.exe

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build Image
        run: docker build -t anydesk-pivot-detector:latest .
      - name: Smoke Test
        run: |
          docker run --name smoke-test -d anydesk-pivot-detector:latest
          sleep 5
          docker ps | grep smoke-test
          docker stop smoke-test
      - name: Image Size
        run: docker images anydesk-pivot-detector:latest
