repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-added-large-files
    -   id: detect-private-key

-   repo: local
    hooks:
    -   id: cargo-fmt
        name: Rust Format Check
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

    -   id: cargo-clippy
        name: Rust Clippy
        entry: cargo clippy -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

    -   id: frontend-lint
        name: Frontend Lint
        entry: pnpm --prefix frontend lint
        language: system
        files: ^frontend/
        pass_filenames: false
