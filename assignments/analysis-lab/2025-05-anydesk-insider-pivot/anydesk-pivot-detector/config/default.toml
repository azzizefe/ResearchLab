[app]
name = "anydesk-pivot-detector"
log_level = "info"
report_output_dir = "./reports"

[anydesk]
trace_path = "%AppData%/AnyDesk/ad.trace"
system_conf_path = "%AppData%/AnyDesk/system.conf"
service_conf_path = "%AppData%/AnyDesk/service.conf"
svc_trace_path = "C:/ProgramData/AnyDesk/ad_svc.trace"

[monitor]
interval_secs = 10
suspicious_processes = ["cmd.exe", "powershell.exe", "net.exe", "nmap.exe", "mimikatz.exe", "psexec.exe"]
alert_threshold = 3
working_hour_start = 9
working_hour_end = 18

[network]
blocked_domains = ["*.net.anydesk.com"]
blocked_ports = [6568, 50001, 50002, 50003]
allowed_anydesk_ids = []
malicious_ips = ["1.1.1.1", "8.8.8.8"] # Placeholder for actual IOCs
high_data_threshold_bytes = 104857600 # 100MB
geoip_db_path = "config/GeoLite2-City.mmdb"

[reporting]
format = "json"
enable_syslog = false
syslog_server = "127.0.0.1"
syslog_port = 514
enable_elasticsearch = true

[elasticsearch]
url = "http://elasticsearch:9200"
index = "anydesk-alerts"

[notifications]
enable_slack = false
slack_webhook_url = "https://hooks.slack.com/services/..."
enable_email = false
smtp_server = "smtp.gmail.com"
smtp_port = 587
smtp_username = "your-email@gmail.com"
smtp_password = "your-app-password"
use_tls = true
email_to = "admin@company.com"
enable_webhook = false
webhook_url = "http://api.company.com/alerts"

[active_response]
enable_process_kill = false
enable_ip_blocking = false
auto_confirm = false
