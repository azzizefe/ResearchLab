version: '3.8'

services:
  detector:
    build: .
    restart: always
    env_file:
      - .env
    volumes:
      - ${ANYDESK_LOG_DIR}:/var/log/anydesk:ro
      - ./reports:/app/reports
    environment:
      - ANYDESK_TRACE_PATH=/var/log/anydesk/ad.trace
      - ELASTICSEARCH_URL=http://es01:9200
    depends_on:
      es01:
        condition: service_healthy

  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: es01
    environment:
      - node.name=es01
      - cluster.name=anydesk-cluster
      - discovery.seed_hosts=es02,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: es02
    environment:
      - node.name=es02
      - cluster.name=anydesk-cluster
      - discovery.seed_hosts=es01,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1

  es03:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: es03
    environment:
      - node.name=es03
      - cluster.name=anydesk-cluster
      - discovery.seed_hosts=es01,es02
      - cluster.initial_master_nodes=es01,es02,es03
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana-prod
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://es01:9200
    depends_on:
      es01:
        condition: service_healthy

  # Setup task for ILM policy
  setup_ilm:
    image: curlimages/curl:latest
    container_name: setup_ilm
    depends_on:
      es01:
        condition: service_healthy
    command: >
      curl -X PUT "http://es01:9200/_ilm/policy/anydesk_alerts_policy" -H 'Content-Type: application/json' -d'
      {
        "policy": {
          "phases": {
            "hot": {
              "actions": {
                "rollover": { "max_age": "30d", "max_size": "50gb" }
              }
            },
            "delete": {
              "min_age": "90d",
              "actions": { "delete": {} }
            }
          }
        }
      }'
